name: One-time schema index repair

on:
  push:
    branches:
      - fix/schema-knowledge-pinned-index
  pull_request:
    branches:
      - claude/healing-migration-ai-os-erewp2

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'push' || github.head_ref == 'fix/schema-knowledge-pinned-index'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/schema-knowledge-pinned-index
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align Drizzle schema with migration index
        shell: python
        run: |
          from pathlib import Path

          path = Path("server/db/schema/projects.ts")
          text = path.read_text(encoding="utf-8")
          index_name = "knowledge_project_pinned_created_idx"

          if index_name not in text:
              start = text.index('export const knowledge = pgTable("knowledge", {')
              end = text.index("\n});", start)
              replacement = '''
}, (t) => ({
  projectPinnedCreatedIdx: index("knowledge_project_pinned_created_idx")
    .on(t.projectId, t.pinned, t.createdAt),
}));'''
              text = text[:end] + replacement + text[end + 4:]
              path.write_text(text, encoding="utf-8")

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit clean repair
        run: |
          rm .github/workflows/fix-schema-index-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db/schema/projects.ts .github/workflows/fix-schema-index-once.yml
          git commit -m "fix(db): align knowledge pinned index with migration"
          git push origin HEAD:fix/schema-knowledge-pinned-index
