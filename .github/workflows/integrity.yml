name: Integrity Firewall

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve comparison base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "INTEGRITY_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "INTEGRITY_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
      - name: Runtime source / destructive diff / critical-file firewall
        run: node scripts/guard-repo-integrity.mjs
      - name: Migration identity / journal / revision firewall
        run: node scripts/guard-migrations.mjs
