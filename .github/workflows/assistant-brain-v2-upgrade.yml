name: Assistant Brain v2 Upgrade

on:
  push:
    branches:
      - feat/assistant-brain-v2-orchestrator

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[assistant-brain-v2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assistant-brain-v2-orchestrator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply typed orchestrator integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # ── server/routers/globalAssistant.ts ──────────────────────────────
          path = "server/routers/globalAssistant.ts"
          replace_once(path,
          'import { publicUrlIntakeCapability } from "../../shared/universalIntake";\n',
          'import { publicUrlIntakeCapability } from "../../shared/universalIntake";\n'
          'import { randomUUID } from "node:crypto";\n'
          'import {\n'
          '  assistantActiveGoalSchema,\n'
          '  type AssistantActiveGoal,\n'
          '  type AssistantEvidenceScope,\n'
          '  type AssistantGoalFrame,\n'
          '} from "../../shared/assistantGoalFrame";\n'
          'import {\n'
          '  deriveDeterministicGoalFrame,\n'
          '  executionPlanFromGoal,\n'
          '  matchAssistantCapabilityForGoal,\n'
          '  resolveWorkingProject,\n'
          '  type AssistantCapabilityMatch,\n'
          '} from "../../shared/assistantSemanticResolution";\n')

          replace_once(path,
          '  /** Bounded typed references from this conversation; never file bytes/content. */\n  recentActionResults?: AssistantActionResult[];\n',
          '  /** Bounded typed references from this conversation; never file bytes/content. */\n'
          '  recentActionResults?: AssistantActionResult[];\n'
          '  /** Bounded typed active goal from the same conversation. Server re-resolves every id. */\n'
          '  activeGoal?: AssistantActiveGoal;\n')

          replace_once(path,
          '  sources: AgentSourceRecord[];\n}\n\nexport interface ResolvedIntakeFallback {',
          '  sources: AgentSourceRecord[];\n'
          '  /** Assistant Brain v2 observable semantic state (never chain-of-thought). */\n'
          '  goalFrame?: AssistantGoalFrame;\n'
          '  activeGoal?: AssistantActiveGoal;\n'
          '  capabilityMatch?: { status: AssistantCapabilityMatch["status"]; capabilityId?: string; reason: string; missingSlots: string[] };\n'
          '  evidenceScope?: AssistantEvidenceScope;\n'
          '  intakeRequest?: AssistantIntakeRequest;\n'
          '}\n\n'
          'export interface AssistantIntakeRequest {\n'
          '  mode: "drive" | "files" | "folder";\n'
          '  projectId: string;\n'
          '  projectTitle: string;\n'
          '  message: string;\n'
          '}\n\n'
          'export interface ResolvedIntakeFallback {')

          replace_once(path,
          '  const executionPlan = classifyAssistantRequest(input.message);\n',
          '  // Regex classifier is now only the immediate SSE routing hint. The typed GoalFrame\n'
          '  // resolved after ACL-filtered context becomes the execution authority.\n'
          '  let executionPlan = classifyAssistantRequest(input.message);\n')

          old_block = '''  const currentProjectRef = input.projectId
    ? [...projByRef.entries()].find(([, p]) => p.id === input.projectId)?.[0]
    : undefined;
  const lastCreatedProjectId = [...(input.recentActionResults ?? [])]
    .reverse()
    .find((result) => result.type === "create_project")?.projectId;
  const recentProjectRef = lastCreatedProjectId
    ? [...projByRef.entries()].find(([, project]) => project.id === lastCreatedProjectId)?.[0]
    : undefined;
  const referencesRecentProject = /(剛建立|剛才建立|上一個專案|這個專案|該專案)/i.test(input.message);
  const mentionedProjectRef = resolveMentionedProjectRef(projByRef, input.message);
  const deterministicProjectRef = currentProjectRef ?? mentionedProjectRef ?? (referencesRecentProject ? recentProjectRef : undefined);
'''
          new_block = '''  // ── Assistant Brain v2: UNDERSTAND → GROUND → RESOLVE ───────────────────
  // The client may carry the previous typed goal, but ids are never trusted: project
  // resolution is performed again against the ACL-filtered project candidates below.
  const semantic = deriveDeterministicGoalFrame(input.message, input.activeGoal);
  let goalFrame = semantic.frame;
  const projectCandidates = [...projByRef.values()].map((project) => ({ id: project.id, title: project.title }));
  const projectResolution = resolveWorkingProject({
    message: input.message,
    candidates: projectCandidates,
    activeGoal: input.activeGoal,
    recentActionResults: input.recentActionResults,
    pageProjectId: input.projectId,
  });
  if (projectResolution.status === "resolved" && projectResolution.projectId) {
    goalFrame = { ...goalFrame, scope: { ...goalFrame.scope, projectId: projectResolution.projectId } };
  }
  let capabilityMatch = matchAssistantCapabilityForGoal(goalFrame);
  executionPlan = executionPlanFromGoal(goalFrame, capabilityMatch, input.message);
  const goalId = semantic.continuation === "NEW_GOAL" || !input.activeGoal ? randomUUID() : input.activeGoal.goalId;
  let activeGoal: AssistantActiveGoal = {
    goalId,
    status: capabilityMatch.status === "matched" ? "ready" : "resolving",
    frame: goalFrame,
    resolvedSlots: {
      ...(input.activeGoal?.resolvedSlots ?? {}),
      ...(projectResolution.status === "resolved" && projectResolution.projectId
        ? { projectId: projectResolution.projectId, projectTitle: projectResolution.projectTitle }
        : {}),
    },
    missingSlots: [...capabilityMatch.missingSlots],
    resultRefIds: input.activeGoal?.resultRefIds ?? [],
  };
  const semanticPayload = () => ({
    goalFrame,
    activeGoal,
    capabilityMatch: {
      status: capabilityMatch.status,
      capabilityId: capabilityMatch.capabilityId,
      reason: capabilityMatch.reason,
      missingSlots: capabilityMatch.missingSlots,
    },
    evidenceScope: capabilityMatch.evidenceScope,
  });
  stream.emit({
    type: "plan.created",
    title: capabilityMatch.capability
      ? `已理解目標：${capabilityMatch.capability.label}`
      : capabilityMatch.status === "unsupported" ? "已確認目前能力邊界" : "已理解目標，還需要一項資訊",
    description: capabilityMatch.reason,
    status: capabilityMatch.status === "matched" ? "ok" : "waiting",
    metadata: {
      goalIntent: goalFrame.intent,
      goalOperation: goalFrame.operation,
      ...(capabilityMatch.capabilityId ? { capabilityId: capabilityMatch.capabilityId } : {}),
      evidenceScope: capabilityMatch.evidenceScope,
    },
  });

  const effectiveProjectId = goalFrame.scope.projectId ?? input.projectId;
  const currentProjectRef = effectiveProjectId
    ? [...projByRef.entries()].find(([, p]) => p.id === effectiveProjectId)?.[0]
    : undefined;
  const deterministicProjectRef = currentProjectRef;
'''
          replace_once(path, old_block, new_block)

          replace_once(path,
          '    currentProjectRef && input.projectId && input.pageContext?.selectedEntityIds?.length\n',
          '    currentProjectRef && effectiveProjectId && input.pageContext?.selectedEntityIds?.length\n')
          replace_once(path,
          '          .where(and(eq(schema.scenes.projectId, input.projectId), isNull(schema.scenes.deletedAt)))\n',
          '          .where(and(eq(schema.scenes.projectId, effectiveProjectId), isNull(schema.scenes.deletedAt)))\n')

          # Add early semantic clarification/handoff immediately after real overview sources are registered.
          anchor = '''  for (const [ref, table] of dbByRef.entries()) {
    stream.addSource({
      id: `database:${table.id}`,
      type: "database",
      name: table.name,
      entityId: table.id,
      href: `/databases/${table.id}`,
      itemCount: table.rowCount,
      detail: `${table.fields.length} 個欄位・代號 ${ref}`,
      toolName: "group_overview",
      status: table.rowCount ? "ok" : "empty",
    });
  }

'''
          insertion = anchor + '''  const earlySemanticResult = (answer: string, intakeRequest?: AssistantIntakeRequest): GlobalAskResult => ({
    answer,
    dispatches: [],
    actions: [],
    siteActions: [],
    executedSiteActions: [],
    intakeFallbacks: [],
    steps: [],
    canDispatch: false,
    commandLevel,
    mock: isMockMode(),
    rationale: undefined,
    contextUsed: [],
    degraded,
    traceSessionId: undefined,
    executionPlan,
    runId: stream.runId,
    events: stream.snapshotEvents(),
    sources: stream.snapshotSources(),
    ...semanticPayload(),
    ...(intakeRequest ? { intakeRequest } : {}),
  });

  // Source ambiguity is a real missing slot, not permission to substitute the project library.
  if (goalFrame.missingSlots.includes("source")) {
    activeGoal = { ...activeGoal, status: "waiting_user_input", missingSlots: ["source"] };
    stream.emit({
      type: "waiting.user_input",
      title: "還需要確認資料來源",
      description: "你說的「雲端」是 Google Drive、Google Photos，還是 Aios 目前專案素材？",
      status: "waiting",
    });
    return earlySemanticResult("我還缺一個資訊：你說的「雲端」是 **Google Drive、Google Photos，還是 Aios 目前專案素材**？你選一個，我會接著同一個目標繼續。 ");
  }

  // A capability may be known but still need a project. Never silently pick a random project.
  if (capabilityMatch.missingSlots.includes("projectId") && projectResolution.status !== "resolved") {
    const candidates = projectResolution.candidates.slice(0, 8);
    activeGoal = {
      ...activeGoal,
      status: "waiting_user_input",
      missingSlots: ["projectId"],
      resolvedSlots: { ...activeGoal.resolvedSlots, projectCandidates: candidates },
    };
    const options = candidates.length
      ? candidates.map((candidate, index) => `${index + 1}. ${candidate.title}`).join("\n")
      : "目前沒有可用的專案。";
    stream.emit({
      type: "waiting.user_input",
      title: "還需要確認目標專案",
      description: candidates.length ? `有 ${candidates.length} 個可用專案，請選一個` : "目前沒有可用專案",
      status: "waiting",
      resultCount: candidates.length,
    });
    return earlySemanticResult(`我知道你要做什麼，但還缺 **目標專案**。\n\n${options}\n\n直接回覆專案名稱或「第二個」即可，我會接著做。`);
  }

  // Remote source facts require a real remote listing capability. Aios must not answer
  // a Google Photos/Drive count using imported/project asset numbers.
  if (capabilityMatch.status === "unsupported" && capabilityMatch.evidenceScope === "REMOTE_SOURCE") {
    activeGoal = { ...activeGoal, status: "waiting_user_input", missingSlots: [] };
    stream.emit({
      type: "waiting.user_input",
      title: "目前無法驗證完整遠端清單",
      description: capabilityMatch.reason,
      status: "waiting",
      sourceType: "external",
      sourceName: goalFrame.source?.type === "GOOGLE_PHOTOS" ? "Google Photos" : "Google Drive",
    });
    return earlySemanticResult(`${capabilityMatch.reason}\n\n我可以改查 **已匯入 Aios 的數量**，或讓你改用可驗證的 Drive／檔案匯入流程。`);
  }

  // Picker-based intake is an explicit waiting handoff. Once project resolution succeeds,
  // the client opens the existing Universal Intake mini-workspace and keeps the same goal.
  if (capabilityMatch.status === "matched" && effectiveProjectId && projectResolution.projectTitle) {
    const mode = capabilityMatch.capabilityId === "import_google_drive" ? "drive"
      : capabilityMatch.capabilityId === "import_local_file" ? "files"
      : capabilityMatch.capabilityId === "import_folder" ? "folder"
      : undefined;
    if (mode) {
      activeGoal = { ...activeGoal, status: "waiting_user_input", missingSlots: [] };
      const intakeRequest: AssistantIntakeRequest = {
        mode,
        projectId: effectiveProjectId,
        projectTitle: projectResolution.projectTitle,
        message: mode === "drive"
          ? `已確認要加入「${projectResolution.projectTitle}」。請選擇 Google Drive 檔案。`
          : mode === "folder"
            ? `已確認要加入「${projectResolution.projectTitle}」。請選擇資料夾。`
            : `已確認要加入「${projectResolution.projectTitle}」。請選擇檔案。`,
      };
      stream.emit({
        type: "waiting.user_input",
        title: mode === "drive" ? "等待你選 Google Drive 資料" : mode === "folder" ? "等待你選資料夾" : "等待你選檔案",
        description: intakeRequest.message,
        status: "waiting",
      });
      return earlySemanticResult(intakeRequest.message, intakeRequest);
    }
  }

'''
          replace_once(path, anchor, insertion)

          replace_once(path,
          '  const base = {\n    canDispatch: routeAllowsDispatch, commandLevel, degraded, traceSessionId, executionPlan, runId: stream.runId, intakeFallbacks,\n  };\n',
          '  const base = {\n'
          '    canDispatch: routeAllowsDispatch, commandLevel, degraded, traceSessionId, executionPlan, runId: stream.runId, intakeFallbacks,\n'
          '    ...semanticPayload(),\n'
          '  };\n')

          replace_once(path,
          '      recentActionResults: z.array(recentActionResultSchema).max(5).optional(),\n',
          '      recentActionResults: z.array(recentActionResultSchema).max(5).optional(),\n'
          '      activeGoal: assistantActiveGoalSchema.optional(),\n')
          replace_once(path,
          '      recentActionResults: input.recentActionResults,\n      mode: input.mode,\n',
          '      recentActionResults: input.recentActionResults,\n'
          '      activeGoal: input.activeGoal,\n'
          '      mode: input.mode,\n')

          # ── server/index.ts: SSE carries mode + active goal ─────────────────
          path = "server/index.ts"
          replace_once(path,
          'import { classifyAssistantRequest, type AssistantLatencyMetrics } from "../shared/assistantExecution";\n',
          'import { classifyAssistantRequest, type AssistantLatencyMetrics } from "../shared/assistantExecution";\n'
          'import { assistantActiveGoalSchema } from "../shared/assistantGoalFrame";\n')
          replace_once(path,
          '  const pageContext = sanitizeAssistantPageContext(req.body?.pageContext) ?? undefined;\n  if (!UUID_RE.test(groupId) || !message || message.length > 500) {\n',
          '  const pageContext = sanitizeAssistantPageContext(req.body?.pageContext) ?? undefined;\n'
          '  const parsedSiteMode = agentPlannerModeSchema.safeParse(req.body?.mode);\n'
          '  const siteMode = parsedSiteMode.success ? parsedSiteMode.data : undefined;\n'
          '  const parsedActiveGoal = assistantActiveGoalSchema.safeParse(req.body?.activeGoal);\n'
          '  const activeGoal = parsedActiveGoal.success ? parsedActiveGoal.data : undefined;\n'
          '  if (!UUID_RE.test(groupId) || !message || message.length > 500) {\n')
          replace_once(path,
          '        recentActionResults: recentActionResults.length ? recentActionResults : undefined,\n        signal: clientAbort.signal,\n',
          '        recentActionResults: recentActionResults.length ? recentActionResults : undefined,\n'
          '        activeGoal,\n'
          '        mode: siteMode,\n'
          '        signal: clientAbort.signal,\n')

          # ── client store: keep active goal across sheet unmount/navigation ──
          path = "client/src/lib/assistantRunStore.ts"
          replace_once(path,
          'import type { AgentEvent, AgentSourceRecord } from "@shared/agentEvents";\n',
          'import type { AgentEvent, AgentSourceRecord } from "@shared/agentEvents";\n'
          'import type { AssistantActiveGoal } from "@shared/assistantGoalFrame";\n')
          replace_once(path,
          '  /** Bounded typed references for "這些資料／剛建立的專案". */\n  recentActionResults?: AssistantActionResult[];\n',
          '  /** Bounded typed references for "這些資料／剛建立的專案". */\n'
          '  recentActionResults?: AssistantActionResult[];\n'
          '  /** Same-goal continuation state; ids are revalidated by the server every turn. */\n'
          '  activeGoal?: AssistantActiveGoal;\n')

          # ── client SSE contract ────────────────────────────────────────────
          path = "client/src/components/assistantStream.ts"
          replace_once(path,
          'import type { AssistantActionResult } from "@shared/assistantActions";\n',
          'import type { AssistantActionResult } from "@shared/assistantActions";\n'
          'import type { AssistantActiveGoal, AssistantEvidenceScope, AssistantGoalFrame } from "@shared/assistantGoalFrame";\n')
          replace_once(path,
          '  sources?: AgentSourceRecord[];\n};\n\nfunction isSiteDoneEvent',
          '  sources?: AgentSourceRecord[];\n'
          '  goalFrame?: AssistantGoalFrame;\n'
          '  activeGoal?: AssistantActiveGoal;\n'
          '  evidenceScope?: AssistantEvidenceScope;\n'
          '  intakeRequest?: { mode: "drive" | "files" | "folder"; projectId: string; projectTitle: string; message: string };\n'
          '};\n\nfunction isSiteDoneEvent')
          replace_once(path,
          '  recentActionResults,\n  mode,\n',
          '  recentActionResults,\n  activeGoal,\n  mode,\n')
          replace_once(path,
          '  recentActionResults?: AssistantActionResult[];\n  /** Explicit answer-model preference. Undefined keeps the server\'s free default. */\n',
          '  recentActionResults?: AssistantActionResult[];\n'
          '  activeGoal?: AssistantActiveGoal;\n'
          '  /** Explicit answer-model preference. Undefined keeps the server\'s free default. */\n')
          replace_once(path,
          '        recentActionResults,\n        mode,\n',
          '        recentActionResults,\n'
          '        activeGoal,\n'
          '        mode,\n')

          # ── AICreativeCopilot: send/store active goal + auto-open intake ───
          path = "client/src/components/AICreativeCopilot.tsx"
          # Add type import adjacent to assistant execution import without depending on exact grouping.
          text = Path(path).read_text()
          if 'from "@shared/assistantGoalFrame"' not in text:
              marker = 'import type { AgentEvent, AgentSourceRecord } from "@shared/agentEvents";\n'
              if marker not in text:
                  raise SystemExit("AICreativeCopilot agentEvents import anchor not found")
              text = text.replace(marker, marker + 'import type { AssistantActiveGoal } from "@shared/assistantGoalFrame";\n', 1)
              Path(path).write_text(text)

          replace_once(path,
          '      intakeFallbacks?: IntakeFallback[];\n    };\n',
          '      intakeFallbacks?: IntakeFallback[];\n'
          '      activeGoal?: AssistantActiveGoal;\n'
          '      intakeRequest?: { mode: "drive" | "files" | "folder"; projectId: string; projectTitle: string; message: string };\n'
          '    };\n')
          replace_once(path,
          '      const resolvedRunStatus: ChatMessage["runStatus"] = hasFailure\n',
          '      const resolvedRunStatus: ChatMessage["runStatus"] = hasFailure\n')
          # Insert state update just before pushMessage in applyDone.
          replace_once(path,
          '      pushMessage({\n        role: "assistant",\n',
          '      if (data.activeGoal) {\n'
          '        const goalStatus: AssistantActiveGoal["status"] = resolvedRunStatus === "completed" ? "completed"\n'
          '          : resolvedRunStatus === "failed" ? "failed"\n'
          '            : data.activeGoal.status === "waiting_confirmation" ? "waiting_confirmation" : "waiting_user_input";\n'
          '        setAssistantConversation<ChatMessage>(groupId, (previous) => ({\n'
          '          ...previous,\n'
          '          activeGoal: { ...data.activeGoal!, status: goalStatus },\n'
          '        }));\n'
          '      }\n'
          '      if (data.intakeRequest) {\n'
          '        setIntakeTargetProjectId(data.intakeRequest.projectId);\n'
          '        setIntakeOpenRequest({ id: `${Date.now()}`, mode: data.intakeRequest.mode });\n'
          '      }\n'
          '      pushMessage({\n        role: "assistant",\n')
          replace_once(path,
          '        recentActionResults: conversation.recentActionResults,\n        mode: readAssistantAnswerMode(),\n',
          '        recentActionResults: conversation.recentActionResults,\n'
          '        activeGoal: conversation.activeGoal,\n'
          '        mode: readAssistantAnswerMode(),\n')
          replace_once(path,
          '              recentActionResults: conversation.recentActionResults,\n              mode: readAssistantAnswerMode(),\n',
          '              recentActionResults: conversation.recentActionResults,\n'
          '              activeGoal: conversation.activeGoal,\n'
          '              mode: readAssistantAnswerMode(),\n')
          replace_once(path,
          '                pushMessage({\n                  role: "assistant",\n                  text: `✓ ${notice.count} 項資料已安全加入。AI 正在背景整理，你可以繼續聊天。`,\n                  runStatus: "completed",\n                });\n',
          '                setAssistantConversation<ChatMessage>(groupId, (previous) => ({\n'
          '                  ...previous,\n'
          '                  activeGoal: previous.activeGoal\n'
          '                    ? { ...previous.activeGoal, status: "completed", missingSlots: [], resultRefIds: notice.assetIds.slice(0, 20) }\n'
          '                    : previous.activeGoal,\n'
          '                }));\n'
          '                pushMessage({\n'
          '                  role: "assistant",\n'
          '                  text: `✓ ${notice.count} 項資料已安全加入。AI 正在背景整理，你可以繼續聊天。`,\n'
          '                  runStatus: "completed",\n'
          '                });\n')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Semantic and assistant regression tests
        run: npx vitest run shared/assistantGoalFrame.test.ts shared/assistantSemanticResolution.test.ts shared/assistantExecution.test.ts server/services/assistantCore.test.ts client/src/components/assistantStream.site.test.ts client/src/components/AICreativeCopilot.test.tsx
      - name: Build
        run: npm run build
      - name: Commit verified upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Aios Brain v2 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/routers/globalAssistant.ts server/index.ts client/src/lib/assistantRunStore.ts client/src/components/assistantStream.ts client/src/components/AICreativeCopilot.tsx
          git commit -m "feat(agent): wire typed goal orchestrator and continuation [assistant-brain-v2-applied]"
          git push origin HEAD:feat/assistant-brain-v2-orchestrator
