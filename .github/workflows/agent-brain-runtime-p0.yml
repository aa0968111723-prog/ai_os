name: Agent Brain Runtime P0

on:
  push:
    branches:
      - fix/agent-brain-runtime-p0

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[agent-runtime-p0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused runtime patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}\n--- OLD ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          # 1) Global assistant SSE must carry the same answer-model preference as other assistants.
          replace_once(
              "client/src/components/assistantStream.ts",
              '''  recentActionResults,\n  signal,\n  handlers,''',
              '''  recentActionResults,\n  mode,\n  signal,\n  handlers,''',
          )
          replace_once(
              "client/src/components/assistantStream.ts",
              '''  recentActionResults?: AssistantActionResult[];\n  signal: AbortSignal;''',
              '''  recentActionResults?: AssistantActionResult[];\n  /** Explicit answer-model preference. Undefined keeps the server's free default. */\n  mode?: AgentPlannerMode;\n  signal: AbortSignal;''',
          )
          replace_once(
              "client/src/components/assistantStream.ts",
              '''        pageContext,\n        recentActionResults,\n      }),''',
              '''        pageContext,\n        recentActionResults,\n        mode,\n      }),''',
          )

          # 2) Aios conversation: honest waiting state + browser capability gate + model preference wiring.
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''import { requestSiteAssistantStream } from "./assistantStream";''',
              '''import { requestSiteAssistantStream } from "./assistantStream";\nimport { readAssistantAnswerMode } from "../lib/agentPlannerPreference";\nimport {\n  classifyAssistantComputerIntent,\n  formatComputerCapabilityAnswer,\n  isRealBrowserReady,\n} from "../lib/assistantComputerIntent";''',
          )
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''  runStatus?: "completed" | "failed" | "stopped";''',
              '''  runStatus?: "completed" | "failed" | "stopped" | "waiting";''',
          )
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''  const ask = trpc.globalAssistant.ask.useMutation();\n  /* 頁面感知：快捷動作、麵包屑與送給後端的 pageContext 都由這一份推導 */''',
              '''  const ask = trpc.globalAssistant.ask.useMutation();\n  // Capability probing is data, not LLM opinion: never ask a model whether the product can browse.\n  const computerStatus = trpc.computerRuntime.status.useQuery(undefined, { staleTime: 30_000, retry: false });\n  const createBrowserSession = trpc.computerRuntime.createSession.useMutation();\n  /* 頁面感知：快捷動作、麵包屑與送給後端的 pageContext 都由這一份推導 */''',
          )
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''    const text = (textToSend ?? input).trim();\n    if (!text || !groupId || pending) return;\n\n    const directIntakeMode = activeProjectId ? detectDirectIntakeRequest(text) : null;''',
              '''    const text = (textToSend ?? input).trim();\n    if (!text || !groupId || pending) return;\n\n    const localPlan = classifyAssistantRequest(text);\n    const computerIntent = classifyAssistantComputerIntent(text);\n    if (computerIntent) {\n      setInput("");\n      const runtime = computerStatus.data ?? (await computerStatus.refetch()).data;\n      const capabilityAnswer = formatComputerCapabilityAnswer(runtime);\n\n      // Capability questions are answered from the actual runtime flags/provider, never model memory.\n      if (computerIntent === "capability") {\n        setAssistantConversation<ChatMessage>(groupId, (previous) => ({\n          ...previous,\n          messages: [\n            ...previous.messages,\n            { role: "user", text },\n            {\n              role: "assistant",\n              text: capabilityAnswer,\n              executionPlan: localPlan,\n              runStatus: "completed",\n              suggestedActions: isRealBrowserReady(runtime)\n                ? [{ label: "開啟瀏覽器", prompt: "幫我在目前專案開啟瀏覽器。" }]\n                : undefined,\n            },\n          ],\n        }));\n        return;\n      }\n\n      // Never fake browser work. A real external provider must be reported ready by the server first.\n      if (!isRealBrowserReady(runtime)) {\n        setAssistantConversation<ChatMessage>(groupId, (previous) => ({\n          ...previous,\n          messages: [\n            ...previous.messages,\n            { role: "user", text },\n            {\n              role: "assistant",\n              text: `${capabilityAnswer}\\n\\n所以這次我沒有假裝開啟瀏覽器；等真實 Browser provider 接通後再執行。`,\n              executionPlan: localPlan,\n              runStatus: "waiting",\n            },\n          ],\n        }));\n        return;\n      }\n\n      if (!activeProjectId) {\n        setAssistantConversation<ChatMessage>(groupId, (previous) => ({\n          ...previous,\n          messages: [\n            ...previous.messages,\n            { role: "user", text },\n            {\n              role: "assistant",\n              text: "要啟動隔離瀏覽器，需要先指定工作專案。請打開或告訴我是哪個專案，我會接著做。",\n              executionPlan: localPlan,\n              runStatus: "waiting",\n            },\n          ],\n        }));\n        return;\n      }\n\n      const startUrl = text.match(/https?:\\/\\/[^\\s<>{}\\[\\]\"']+/i)?.[0];\n      try {\n        const session = await createBrowserSession.mutateAsync({\n          projectId: activeProjectId,\n          startUrl,\n          label: `Aios：${text.slice(0, 100)}`,\n        });\n        setAssistantConversation<ChatMessage>(groupId, (previous) => ({\n          ...previous,\n          messages: [\n            ...previous.messages,\n            { role: "user", text },\n            {\n              role: "assistant",\n              text: `已驗證啟動隔離 Browser Runtime${session.currentUrl ? `，目前網址：${session.currentUrl}` : ""}。`,\n              executionPlan: localPlan,\n              runStatus: "completed",\n            },\n          ],\n        }));\n      } catch (error) {\n        setAssistantConversation<ChatMessage>(groupId, (previous) => ({\n          ...previous,\n          messages: [\n            ...previous.messages,\n            { role: "user", text },\n            {\n              role: "assistant",\n              text: `瀏覽器沒有啟動成功：${error instanceof Error ? error.message : "執行失敗"}`,\n              executionPlan: localPlan,\n              runStatus: "failed",\n            },\n          ],\n        }));\n      }\n      return;\n    }\n\n    const directIntakeMode = activeProjectId ? detectDirectIntakeRequest(text) : null;''',
          )
          # The old localPlan declaration is now redundant (we create it before capability routing).
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''    const newHistory = messages.slice(-6).map((m) => ({ role: m.role, text: m.text }));\n    const localPlan = classifyAssistantRequest(text);''',
              '''    const newHistory = messages.slice(-6).map((m) => ({ role: m.role, text: m.text }));''',
          )
          # Opening a sheet/picker is waiting for user input, not completed work.
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''          { role: "assistant", text: "我會在這個對話裡準備正式的 LumaFusion 交接。請先確認範圍與主要素材；建立後工作階段會保留在這裡。", runStatus: "completed" },''',
              '''          { role: "assistant", text: "我會在這個對話裡準備正式的 LumaFusion 交接。請先確認範圍與主要素材；建立後工作階段會保留在這裡。", runStatus: "waiting" },''',
          )
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''            runStatus: "completed",\n          },\n        ],\n      }));\n      setIntakeOpenRequest''',
              '''            runStatus: "waiting",\n          },\n        ],\n      }));\n      setIntakeOpenRequest''',
          )
          # Derive terminal state from real events and pending confirmations rather than hard-coding completed.
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''      const actionResults = assistantActionResultsFromExecuted(data.executedSiteActions ?? []);\n      recordAssistantActionResults(groupId, actionResults);\n      pushMessage({''',
              '''      const actionResults = assistantActionResultsFromExecuted(data.executedSiteActions ?? []);\n      recordAssistantActionResults(groupId, actionResults);\n      const hasFailure = events.some((event) => event.type === "agent.failed" && event.status === "failed");\n      const hasWaiting = !!data.intakeFallbacks?.length\n        || data.siteActions.length > 0\n        || events.some((event) => (event.type === "waiting.permission" || event.type === "waiting.user_input") && event.status === "waiting");\n      const hasVerifiedCompletion = events.some((event) => event.type === "agent.completed" && event.status === "ok");\n      const resolvedRunStatus: ChatMessage["runStatus"] = hasFailure\n        ? "failed"\n        : hasWaiting\n          ? "waiting"\n          : hasVerifiedCompletion\n            ? "completed"\n            : "waiting";\n      pushMessage({''',
          )
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''        runStatus: "completed",\n        latency: data.latency,''',
              '''        runStatus: resolvedRunStatus,\n        latency: data.latency,''',
          )
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''        recentActionResults: conversation.recentActionResults,\n        signal: controller.signal,''',
              '''        recentActionResults: conversation.recentActionResults,\n        mode: readAssistantAnswerMode(),\n        signal: controller.signal,''',
          )
          replace_once(
              "client/src/components/AICreativeCopilot.tsx",
              '''              recentActionResults: conversation.recentActionResults,\n            },''',
              '''              recentActionResults: conversation.recentActionResults,\n              mode: readAssistantAnswerMode(),\n            },''',
          )

          # 3) Terminal execution card understands waiting/incomplete state.
          replace_once(
              "client/src/components/AgentRunCard.tsx",
              '''  outcome?: "completed" | "failed" | "stopped";''',
              '''  outcome?: "completed" | "failed" | "stopped" | "waiting";''',
          )
          replace_once(
              "client/src/components/AgentRunCard.tsx",
              '''    : outcome === "failed"\n      ? { icon: "XCircle" as const, label: "未完成", className: undefined }\n      : outcome === "stopped"\n        ? { icon: "Square" as const, label: "已停止", className: undefined }\n        : { icon: "Check" as const, label: "已完成", className: undefined };''',
              '''    : outcome === "failed"\n      ? { icon: "XCircle" as const, label: "未完成", className: undefined }\n      : outcome === "stopped"\n        ? { icon: "Square" as const, label: "已停止", className: undefined }\n        : outcome === "waiting"\n          ? { icon: "CircleDot" as const, label: "等待下一步", className: undefined }\n          : { icon: "Check" as const, label: "已完成", className: undefined };''',
          )
          replace_once(
              "client/src/components/AgentRunCard.tsx",
              '''        <strong>{active ? "Aios 正在處理" : state.label === "已完成" ? "Aios 已完成" : `Aios ${state.label}`}</strong>''',
              '''        <strong>{active ? "Aios 正在處理" : state.label === "已完成" ? "Aios 已完成" : state.label === "等待下一步" ? "Aios 等待下一步" : `Aios ${state.label}`}</strong>''',
          )

          # 4) Computer runtime exposes provider truth; today it is deliberately mock-only.
          replace_once(
              "server/routers/computerRuntime.ts",
              '''    enabled: isComputerRuntimeEnabled(),\n    browserEnabled: isComputerBrowserEnabled(),''',
              '''    enabled: isComputerRuntimeEnabled(),\n    browserEnabled: isComputerBrowserEnabled(),\n    // sessionCore currently provisions MockBrowserProvider only. Expose that truth to the orchestrator/UI.\n    browserProvider: "mock" as const,\n    liveExternalWebEnabled: false,''',
          )

          # 5) Capability registry knows that computer/browser is a first-class domain.
          replace_once(
              "shared/assistantExecution.ts",
              '''  domain: "PROJECT" | "TASK" | "NOTE" | "MEMORY" | "STORYBOARD" | "SCRIPT" | "ASSET" | "INTAKE" | "DATABASE" | "SCHEDULE" | "MEMBER" | "COLLABORATION" | "GENERATION";''',
              '''  domain: "PROJECT" | "TASK" | "NOTE" | "MEMORY" | "STORYBOARD" | "SCRIPT" | "ASSET" | "INTAKE" | "DATABASE" | "SCHEDULE" | "MEMBER" | "COLLABORATION" | "COMPUTER" | "GENERATION";''',
          )
          replace_once(
              "shared/assistantExecution.ts",
              '''  { id: "read_collaboration", domain: "COLLABORATION", access: "READ", label: "讀取阻塞與代理狀態", risk: "READ", direct: true },\n  { id: "send_dm",''',
              '''  { id: "read_collaboration", domain: "COLLABORATION", access: "READ", label: "讀取阻塞與代理狀態", risk: "READ", direct: true },\n  capability({ id: "inspect_computer_runtime", domain: "COMPUTER", access: "READ", label: "確認 Browser / Desktop Runtime 能力", risk: "READ", direct: true, executionMode: "DIRECT_TOOL", handler: "computerRuntime.status", resultType: "generic", verificationStrategy: "read_back" }),\n  capability({ id: "open_browser_runtime", domain: "COMPUTER", access: "WRITE", label: "開啟隔離瀏覽器", risk: "SAFE_WRITE", direct: true, requiredContextSlots: ["projectId"], executionMode: "BROWSER_FALLBACK", handler: "computerRuntime.createSession", resultType: "generic", verificationStrategy: "read_back" }),\n  { id: "send_dm",''',
          )
          replace_once(
              "shared/assistantExecution.ts",
              '''const QUESTION_RE = /(?:為什麼|怎麼|如何|是否|能不能|可不可以|哪些|什麼|何時|哪裡|分析|評估|比較|解釋|告訴我|\\?|？)/i;''',
              '''const QUESTION_RE = /(?:為什麼|怎麼|如何|是否|能不能|可不可以|能否|哪些|什麼|何時|哪裡|分析|評估|比較|解釋|告訴我|嗎|\\?|？)/i;''',
          )
          replace_once(
              "shared/assistantExecution.ts",
              '''const CAPABILITY_GOAL_PATTERNS: ReadonlyArray<{ id: string; pattern: RegExp }> = [\n  { id: "import_url",''',
              '''const CAPABILITY_GOAL_PATTERNS: ReadonlyArray<{ id: string; pattern: RegExp }> = [\n  { id: "open_browser_runtime", pattern: /(?:開啟|打開|啟動).{0,10}(?:瀏覽器|browser)|(?:瀏覽器|browser).{0,10}(?:開啟|打開|啟動)/i },\n  { id: "import_url",''',
          )
          replace_once(
              "shared/assistantExecution.ts",
              '''  if (asksQuestion && /(?:如何|怎麼|能不能|可不可以)/i.test(text)) {\n    return {\n      intent: "ASK",\n      confidence: "high",\n      title,\n      steps: ["讀取目前上下文", "查證需要的資料", "整理結論與下一步"],\n    };\n  }''',
              '''  if (asksQuestion) {\n    const browserCapability = /(?:瀏覽器|browser)/i.test(text)\n      ? ASSISTANT_CAPABILITIES.find((item) => item.id === "inspect_computer_runtime")\n      : undefined;\n    const questionCapability = browserCapability ?? matchedCapability;\n    return {\n      intent: "ASK",\n      confidence: "high",\n      title,\n      steps: ["讀取目前上下文", "查證需要的資料", "整理結論與下一步"],\n      ...(questionCapability ? { capabilityId: questionCapability.id, executionMode: questionCapability.executionMode } : {}),\n    };\n  }''',
          )

          # 6) One schema-repair turn before falling back to weak plain text.
          replace_once(
              "server/services/assistantCore.ts",
              '''  const steps: string[] = [];\n  let toolBlocks = "";\n  for (let round = 0; ; round++) {''',
              '''  const steps: string[] = [];\n  let toolBlocks = "";\n  let formatRepairUsed = false;\n  for (let round = 0; ; round++) {''',
          )
          replace_once(
              "server/services/assistantCore.ts",
              '''    const reply = json !== null ? opts.tryReply(json) : null;\n    if (reply !== null) return { reply, steps, aborted: false, usedFallback: false };\n    // 解析失敗：純文字 fallback（不提議任何動作——動作必須來自結構化回覆）。''',
              '''    const reply = json !== null ? opts.tryReply(json) : null;\n    if (reply !== null) return { reply, steps, aborted: false, usedFallback: false };\n    // 模型偶發會包 markdown／壞 JSON。先給一次格式修復機會；仍失敗才降級成純文字。\n    // 修復訊息只要求符合既有 schema，不增加任何工具權限，也不會把寫入提議直接執行。\n    if (!forceFinal && !formatRepairUsed) {\n      formatRepairUsed = true;\n      toolBlocks += `\\n<格式修復>\\n上一輪不是有效的工具呼叫或最終回覆 JSON。請不要解釋、不要加 markdown，只回一個符合目前 schema 的 JSON 物件。\\n</格式修復>`;\n      continue;\n    }\n    // 解析失敗：純文字 fallback（不提議任何動作——動作必須來自結構化回覆）。''',
          )

          # 7) Tests: model preference transport, browser capability, schema repair.
          replace_once(
              "client/src/components/assistantStream.site.test.ts",
              '''      groupId: "g1", message: "問", projectId: "p1",\n      history: [{ role: "user", text: "上一句" }],''',
              '''      groupId: "g1", message: "問", projectId: "p1", mode: "fal_balanced",\n      history: [{ role: "user", text: "上一句" }],''',
          )
          replace_once(
              "client/src/components/assistantStream.site.test.ts",
              '''    expect(seen[0]).toEqual({ groupId: "g1", message: "問", projectId: "p1", history: [{ role: "user", text: "上一句" }] });''',
              '''    expect(seen[0]).toEqual({ groupId: "g1", message: "問", projectId: "p1", history: [{ role: "user", text: "上一句" }], mode: "fal_balanced" });''',
          )
          replace_once(
              "shared/assistantExecution.test.ts",
              '''    ["如何建立任務？", "ASK"],''',
              '''    ["如何建立任務？", "ASK"],\n    ["你可以用瀏覽器嗎？", "ASK"],\n    ["幫我開啟瀏覽器", "DIRECT"],''',
          )
          replace_once(
              "shared/assistantExecution.test.ts",
              '''      "DATABASE", "SCHEDULE", "MEMBER", "COLLABORATION", "GENERATION",''',
              '''      "DATABASE", "SCHEDULE", "MEMBER", "COLLABORATION", "COMPUTER", "GENERATION",''',
          )
          replace_once(
              "shared/assistantExecution.test.ts",
              '''    expect(ASSISTANT_CAPABILITIES.find((item) => item.id === "orchestrate_group_campaign")?.executionMode).toBe("GROUP_CAMPAIGN");''',
              '''    expect(classifyAssistantRequest("你可以用瀏覽器嗎？")).toMatchObject({\n      intent: "ASK", capabilityId: "inspect_computer_runtime", executionMode: "DIRECT_TOOL",\n    });\n    expect(classifyAssistantRequest("幫我開啟瀏覽器")).toMatchObject({\n      intent: "DIRECT", capabilityId: "open_browser_runtime", executionMode: "BROWSER_FALLBACK",\n    });\n    expect(ASSISTANT_CAPABILITIES.find((item) => item.id === "orchestrate_group_campaign")?.executionMode).toBe("GROUP_CAMPAIGN");''',
          )
          replace_once(
              "server/services/assistantCore.test.ts",
              '''  it("壞 JSON → 純文字 fallback（不提議動作）", async () => {\n    const out = await runToolLoop({\n      ...baseOpts,\n      llm: async () => "我想想 {壞掉的json} 大概是這樣",\n    });\n    expect(out.usedFallback).toBe(true);\n    expect((out.reply as { answer: string }).answer).toContain("fallback:");\n  });''',
              '''  it("壞 JSON 先修復一次，第二輪合法就不降級", async () => {\n    const outputs = ["我想想 {壞掉的json} 大概是這樣", '{"answer":"修好了"}'];\n    const out = await runToolLoop({\n      ...baseOpts,\n      llm: async () => outputs.shift()!,\n    });\n    expect(out.usedFallback).toBe(false);\n    expect(out.reply).toEqual({ answer: "修好了" });\n  });\n\n  it("格式修復仍失敗才走純文字 fallback（不提議動作）", async () => {\n    const out = await runToolLoop({\n      ...baseOpts,\n      llm: async () => "我想想 {壞掉的json} 大概是這樣",\n    });\n    expect(out.usedFallback).toBe(true);\n    expect((out.reply as { answer: string }).answer).toContain("fallback:");\n  });''',
          )

          # New deterministic capability helper: capability truth comes from server flags/provider, not an LLM guess.
          Path("client/src/lib/assistantComputerIntent.ts").write_text('''export type AssistantComputerIntent = "capability" | "operate" | null;\n\nexport interface AssistantComputerRuntimeStatus {\n  enabled?: boolean;\n  browserEnabled?: boolean;\n  browserProvider?: string;\n  liveExternalWebEnabled?: boolean;\n}\n\nexport function classifyAssistantComputerIntent(text: string): AssistantComputerIntent {\n  const normalized = text.trim();\n  if (!/(?:瀏覽器|browser)/i.test(normalized)) return null;\n  const capabilityQuestion =\n    /(?:可以|能不能|可不可以|能否|會不會|支援|能用|可以用|有沒有).{0,20}(?:瀏覽器|browser)|(?:瀏覽器|browser).{0,20}(?:可以|能|支援|會)/i.test(normalized);\n  if (capabilityQuestion) return "capability";\n  const operate =\n    /(?:幫我|替我|直接|請|開啟|打開|啟動|操作|前往).{0,24}(?:瀏覽器|browser)|(?:瀏覽器|browser).{0,24}(?:前往|打開|開啟|啟動|操作|查|看)/i.test(normalized);\n  return operate ? "operate" : null;\n}\n\nexport function isRealBrowserReady(status: AssistantComputerRuntimeStatus | null | undefined): boolean {\n  return !!status?.enabled\n    && !!status.browserEnabled\n    && status.liveExternalWebEnabled === true\n    && status.browserProvider !== "mock";\n}\n\nexport function formatComputerCapabilityAnswer(status: AssistantComputerRuntimeStatus | null | undefined): string {\n  if (!status) return "我目前無法讀到 Browser Runtime 狀態，所以不會猜測自己能不能操作瀏覽器。";\n  if (!status.enabled || !status.browserEnabled) {\n    return "目前這個部署的 AI 工作電腦 / Browser Runtime 尚未啟用，所以我現在不能直接操作瀏覽器，也不會假裝已經操作。";\n  }\n  if (!isRealBrowserReady(status)) {\n    return "我有隔離 Browser Runtime 的操作框架，但目前這個部署仍是 mock 測試 provider，尚不能把它當成真實外網瀏覽器。要真正瀏覽網站，需要接上 Browserbase、E2B 或可用的 Playwright provider。";\n  }\n  return "可以。真實的隔離 Browser Runtime 已啟用；你指定專案與網址後，我可以建立工作階段並回報實際執行結果。";\n}\n''')

          Path("client/src/lib/assistantComputerIntent.test.ts").write_text('''import { describe, expect, it } from "vitest";\nimport { classifyAssistantComputerIntent, formatComputerCapabilityAnswer, isRealBrowserReady } from "./assistantComputerIntent";\n\ndescribe("assistant computer intent", () => {\n  it("辨識能力詢問，不把『你可以用瀏覽器嗎』當成已執行", () => {\n    expect(classifyAssistantComputerIntent("你可以用瀏覽器嗎？")).toBe("capability");\n  });\n\n  it("辨識明確操作要求", () => {\n    expect(classifyAssistantComputerIntent("幫我開啟瀏覽器")).toBe("operate");\n  });\n\n  it("mock provider 永遠不宣稱能真實瀏覽外網", () => {\n    const status = { enabled: true, browserEnabled: true, browserProvider: "mock", liveExternalWebEnabled: false };\n    expect(isRealBrowserReady(status)).toBe(false);\n    expect(formatComputerCapabilityAnswer(status)).toContain("mock");\n    expect(formatComputerCapabilityAnswer(status)).toContain("尚不能");\n  });\n\n  it("只有 server 明確回報 real external web ready 才允許建立工作階段", () => {\n    expect(isRealBrowserReady({ enabled: true, browserEnabled: true, browserProvider: "browserbase", liveExternalWebEnabled: true })).toBe(true);\n  });\n});\n''')
