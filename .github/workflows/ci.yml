name: CI
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 原本 check 一個 job 串了 audit→typecheck→棘輪→test→coverage→build 共 7 步，
  # 任何一步紅掉後面全 skip。實際後果：#247 之後連續五次合併，build 一次都沒跑到——
  # 沒有人知道那幾版還建不建得起來。拆成三個彼此獨立的 job，一個紅不會遮蔽其他訊號。
  # 三個都要設成 required status check，否則拆了也擋不住合併。
  lint-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:high
      - run: npm run typecheck
      - run: npm run check:ui-primitives
      # 模組邊界（shared/ 不得反向依賴 server/client）：腳本早就在 repo 裡且是綠的，
      # 但從未被任何 workflow 引用，等於白寫。掛進來的邊際成本接近零。
      - run: npm run check:boundaries
      # 早退之後才呼叫 hook＝React #310，整頁進 ErrorBoundary。這一類本該由
      # eslint react-hooks/rules-of-hooks 擋掉，但本專案沒裝 ESLint，等於沒有防線；
      # 專案頁就是這樣壞掉的，先用專用守門擋住最致命的那一種。
      - run: npm run check:hooks

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:client:coverage
      - name: 保存前端測試覆蓋率證據
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-coverage-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # 獨立 job：建置是「這版還能不能出貨」的唯一證據，不該被任何測試失敗連坐 skip。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-00000000000000000000000000000000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 驗證 migration 與 schema drift
        run: |
          set -o pipefail
          sh scripts/ci-migration-test.sh 2>&1 | tee /tmp/migration-ci.log
      - name: 驗證分散式 rate limit
        run: |
          set -o pipefail
          npx tsx scripts/ci-rate-limit-test.ts 2>&1 | tee /tmp/rate-limit-ci.log
      - name: 保存 migration 與 rate-limit 證據
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-and-rate-limit-${{ github.run_attempt }}
          path: |
            /tmp/migration-ci.log
            /tmp/rate-limit-ci.log
          if-no-files-found: warn
          retention-days: 30

  # 每套 e2e 都從「全新資料庫」起跑：
  # 重置 public+ledger → 明確 migrate/check → 啟動伺服器(seed「動畫組」等) → 跑套件。
  # 環境與本機驗證口徑一致:E2E_MOCK=1(測試專用假生成,不花錢)+ MOCK_BILLING=1(仍真扣點,額度護欄可驗)。
  # animation-consistency 本機用獨立庫 aios_anim_e2e（防誤 DROP 開發庫）；CI 這份
  # postgres service 每套都 DROP SCHEMA，等價。Python 腳本走 /api/trpc，不需 Vite／Chrome。
  # phone-animation-repair 不進矩陣：要 Vite :5173、TEST_EMAIL/TEST_PW、Chrome、已種子專案。
  # 注意:正式部署一律真實模式(示範模式已移除),E2E_MOCK 只在這裡與本機測試設定。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PORT: "3199"
      E2E_PORT: "3199"
      E2E_MOCK: "1"
      MOCK_BILLING: "1"
      SEED_ADMIN_EMAIL: admin@aidirector.local
      SEED_ADMIN_PASSWORD: test-admin-123
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-00000000000000000000000000000000
      ASSET_SIGN_SECRET: ci-only-asset-sign-secret-00000000000000000000000000000000
      MCP_API_KEY: test-mcp-key
      ALLOW_LEGACY_MCP_ADMIN_KEY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 依序跑各套 e2e(每套全新 DB + 重啟伺服器)
        run: |
          set -eu
          # 與 run-e2e-local.sh／run-animation-consistency.sh 同口徑：殘留 APP_URL／
          # PUBLIC_DOMAIN 會讓 E2E_MOCK 成品指到抓不到的 /api/mock-asset（persist 404）；
          # 殘留 S3_* 會讓 /api/ready 的 storage 探針打內網 MinIO 而 503。
          unset S3_ENDPOINT MINIO_ENDPOINT S3_BUCKET MINIO_BUCKET \
                S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY MINIO_ACCESS_KEY MINIO_SECRET_KEY \
                MINIO_ROOT_USER MINIO_ROOT_PASSWORD \
                APP_URL PUBLIC_DOMAIN RAILWAY_PUBLIC_DOMAIN
          export E2E_PORT="${E2E_PORT:-$PORT}"
          for suite in auth models phase2 phase3 phase4 story messages databases agent mcp push export animation-consistency; do
            echo "::group::e2e-$suite"
            # 全新資料庫：public 與 migration ledger 必須一起重置，避免 ledger 假稱已套用。
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
              -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public; DROP SCHEMA IF EXISTS drizzle CASCADE;' -q
            npm run db:migrate
            npm run db:check
            # setsid:npx→tsx→node 是一串子行程,單殺 npx 會留下佔埠孤兒讓下一套 EADDRINUSE;
            # 讓它當行程群組長,結束時對負 pid 送 TERM 整組收乾淨(本機驗證時實際踩過這雷)。
            setsid npx tsx server/index.ts > "/tmp/server-$suite.log" 2>&1 &
            SERVER_PID=$!
            # schema 已由顯式 migration 完成；等 /api/ready 真正 ok:true + boot ready。
            # 勿用 `curl -sf | grep '"boot":"ready'`：初始化中 503 時 -f 吞掉 body，易誤判。
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "伺服器行程已死,啟動 log:"; cat "/tmp/server-$suite.log"; exit 1
            fi
            if ! bash scripts/wait-api-ready.sh "http://127.0.0.1:${PORT}" 90; then
              echo "90 秒內未就緒,啟動 log:"; cat "/tmp/server-$suite.log"; exit 1
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "就緒後伺服器已死,啟動 log:"; cat "/tmp/server-$suite.log"; exit 1
            fi
            python3 "scripts/e2e-$suite.py" || { echo "套件失敗,伺服器 log:"; tail -50 "/tmp/server-$suite.log"; exit 1; }
            # /bin/kill:sh(dash)內建 kill 吃不下負 pid;bash 可以,但外部 kill 兩者皆穩
            /bin/kill -TERM -- "-$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            echo "::endgroup::"
          done
      - name: 保存 E2E 伺服器紀錄
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-logs-${{ github.run_attempt }}
          path: /tmp/server-*.log
          if-no-files-found: warn
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - name: 建置正式非 root 映像
        run: >-
          docker build
          --build-arg BUILD_SHA="${GITHUB_SHA}"
          --build-arg BUILD_BRANCH="${GITHUB_REF_NAME}"
          --build-arg BUILD_TIME="$(date -u +%FT%TZ)"
          --tag ai-director-os:ci .
      - name: 驗證映像執行身分與健康檢查
        run: |
          docker image inspect ai-director-os:ci > /tmp/container-inspect.json
          test "$(docker image inspect ai-director-os:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect ai-director-os:ci --format '{{json .Config.Healthcheck.Test}}')" != "null"
      - name: 保存正式映像驗證證據
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-inspect-${{ github.run_attempt }}
          path: /tmp/container-inspect.json
          if-no-files-found: warn
          retention-days: 14
