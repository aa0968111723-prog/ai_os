<!doctype html>
<html lang="zh-Hant">
<head>

<title>離線 · Aios</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:#e9e3d8;color:#2b2620;font-family:system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
.card{width:min(400px,100%);text-align:center;background:#fdfbf6;border:1px solid #e3d7c2;border-radius:16px;padding:28px 24px;box-shadow:0 8px 18px -6px rgba(74,54,32,.12)}
img{width:72px;height:72px;object-fit:contain;margin-bottom:12px}
h1{margin:0 0 8px;font-size:22px;font-weight:700}
p{margin:0 0 20px;color:#6f6355;font-size:15px;line-height:1.55}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:999px;padding:12px 22px;background:#b0542f;color:#fff7f1;min-height:44px}
</style>
</head>
<body>
<div class="card">
<img src="/icons/icon-v2-192.png" alt="" width="72" height="72"/>
<h1>目前離線</h1>
<p>Aios 需要連上網路才能載入專案與資料。恢復連線後再試一次即可。</p>
<button type="button" onclick="location.reload()">重新連線</button>
</div>
</body>
