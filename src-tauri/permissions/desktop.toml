[[permission]]
identifier = "allow-desktop-bridge"
description = "Allows the trusted Aios production WebView to detect allowlisted editors, manage Aios-owned media handoffs, and scan a user-chosen import folder (relative paths only — the absolute path never leaves the native side)."
commands.allow = [
  "detect_editors",
  "open_asset",
  "reveal_asset",
  "stop_handoff",
  "pick_import_folder",
  "scan_import_folder",
  "forget_import_folder"
]
